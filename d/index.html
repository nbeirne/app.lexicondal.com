<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A cocktail, shared with you — Martini</title>

    <!-- App Clip card + Smart App Banner. On iOS this URL (matched by the
         app's Associated Domains + /.well-known/apple-app-site-association)
         opens the Martini app if installed, or offers the App Clip / App Store
         otherwise. This page is the fallback shown to everyone else. -->
    <meta name="apple-itunes-app"
          content="app-clip-bundle-id=xyz.hydrus.cocktail.Clip, app-id=1570003820">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <style type="text/css">
body{margin:40px auto;max-width:650px;line-height:1.6;font-size:18px;color:#444;padding:0 10px;font-family: Arial, sans-serif;text-align:center;}
h1,h2{margin:auto;width:90%;padding:10px;}
h2{font-size:22px;font-weight:normal;color:#777;}
a{color:#66D;}
@media (prefers-color-scheme: dark) {
  body{color:#BBB;}
  html{background:#222;}
  h2{color:#999;}
}
.appicon {
  border-radius: 20%;
  display: block;
  margin: 30px auto 40px auto;
  width: 45%;
  max-width: 220px;
  box-shadow: 1px 2px 10px 1px rgba(0, 0, 0, .2);
}
.cta {
  display:inline-block;
  margin-top:10px;
  padding:14px 28px;
  border-radius:14px;
  background:#66D;
  color:#fff;
  font-size:18px;
  text-decoration:none;
}
.note{font-size:15px;color:#999;margin-top:36px;}
    </style>
  </head>
  <body>
    <header>
      <h1>Someone shared a cocktail with you</h1>
      <h2>Open it in Martini, a little cocktail app.</h2>
    </header>

    <a href="https://apps.apple.com/us/app/martini/id1570003820">
      <img src="/martini.png" class="appicon" alt="Martini app icon" />
    </a>

    <p><a class="cta" id="get" href="https://apps.apple.com/us/app/martini/id1570003820">Get Martini</a></p>

    <p class="note" id="hint">
      On an iPhone or iPad, this link opens the recipe right in the Martini app.
    </p>

    <script>
      // The whole recipe travels inside this link's `d` token (a self-contained
      // DrinkArchive payload — no server lookup). Installed iOS apps receive the
      // URL directly via Associated Domains; this page is the fallback for
      // everyone else. We surface whether a recipe token is present but do not
      // decode it here (the archive is zstd + dictionary + TLV; decoding lives
      // in the app / App Clip).
      (function () {
        var token = new URLSearchParams(window.location.search).get("d");
        if (!token) {
          document.getElementById("hint").textContent =
            "This link is missing its recipe. Ask the sender to share it again.";
        }
      })();
    </script>
  </body>
</html>
